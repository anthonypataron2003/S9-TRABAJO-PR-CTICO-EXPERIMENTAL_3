<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6fa">
  <title>Editar tarea | Enfoque</title>
  <style>
    :root {
      --ink: #20243a;
      --muted: #777d91;
      --line: #e9eaf0;
      --primary: #6258d9;
      --primary-dark: #5147c5;
      --primary-soft: #f0efff;
    }

    * { box-sizing: border-box; }

    body {
      display: grid;
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      place-items: center;
      background: #f5f6fa;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .edit-card {
      width: min(100%, 480px);
      padding: 32px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 18px 48px rgb(37 42 76 / 7%);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 34px;
      color: var(--ink);
      font-size: 16px;
      font-weight: 750;
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      width: 33px;
      height: 33px;
      place-items: center;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--primary);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 27px;
      font-weight: 720;
      letter-spacing: -.8px;
    }

    .description {
      margin: 9px 0 24px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 650;
    }

    input {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: none;
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      transition: border-color .15s, box-shadow .15s;
    }

    input:focus {
      border-color: #aaa5f1;
      box-shadow: 0 0 0 3px rgb(98 88 217 / 10%);
    }

    .error {
      margin: 8px 0 0;
      color: #bd4654;
      font-size: 12px;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      margin-top: 24px;
    }

    .button {
      display: inline-flex;
      min-height: 39px;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: #686d80;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 650;
      text-decoration: none;
      transition: background .15s, color .15s, border-color .15s;
    }

    .button:hover { background: #f7f7fa; color: var(--ink); }

    .button.primary {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .button.primary:hover { border-color: var(--primary-dark); background: var(--primary-dark); }

    a:focus-visible, button:focus-visible, input:focus-visible {
      outline: 3px solid rgb(98 88 217 / 35%);
      outline-offset: 2px;
    }

    @media (max-width: 480px) {
      body { padding: 14px; }
      .edit-card { padding: 24px 20px; }
      .brand { margin-bottom: 28px; }
    }
  </style>
</head>
<body>
  <main class="edit-card">
    <a class="brand" href="{% url 'lista' %}">
      <span class="brand-mark" aria-hidden="true">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
          <path d="m5 12.5 4.2 4.2L19 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      Enfoque
    </a>
    <p class="eyebrow">Organiza tu trabajo</p>
    <h1>Editar tarea</h1>
    <p class="description">Actualiza el título para mantener tu lista clara y al día.</p>
    <form method="post">
      {% csrf_token %}
      <label for="titulo">Título de la tarea</label>
      <input id="titulo" type="text" name="titulo" value="{{ tarea.titulo }}" maxlength="120" required autofocus>
      {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
      <div class="actions">
        <a class="button" href="{% url 'lista' %}">Cancelar</a>
        <button class="button primary" type="submit">Guardar cambios</button>
      </div>
    </form>
  </main>
</body>
</html>
