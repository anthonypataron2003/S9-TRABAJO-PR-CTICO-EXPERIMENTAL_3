name: CI/CD Django

on:
  push:
    branches: [ci-setup, main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_NAME: test_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar tests
        run: python manage.py test

  build:
    name: build y despliegue simulado
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: docker compose build

      - name: Levantar contenedores (despliegue simulado)
        run: docker compose up -d

      - name: Verificar que la aplicacion responde
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/salud/; then
              echo ""
              echo "Aplicacion operativa"
              exit 0
            fi
            echo "Esperando a la aplicacion ($i/30)..."
            sleep 3
          done
          docker compose logs
          exit 1

      - name: Mostrar contenedores en ejecucion
        run: docker compose ps

      - name: Apagar contenedores
        if: always()
        run: docker compose down -v

      - name: Guardar imagen Docker como artefacto
        run: docker save django-cicd:latest | gzip > django-cicd-image.tar.gz

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: imagen-docker-django
          path: django-cicd-image.tar.gz