services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: tareas_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tareas_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    image: django-cicd:latest
    ports:
      - "8000:8000"
    environment:
      DB_NAME: tareas_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: